services:
  - type: web
    name: gayatri-portfolio-ai
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: HF_TOKEN
        sync: false
      - key: HF_MODEL
        value: Qwen/Qwen3-14B:nscale
      - key: ALLOWED_ORIGINS
        value: https://gayatri-sharma.github.io
