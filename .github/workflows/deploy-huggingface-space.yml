name: Deploy recruiter assistant to Hugging Face Space

on:
  push:
    branches: ["main"]
    paths:
      - "server/**"
      - "data/portfolio-context.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "hf-space/**"
      - ".github/workflows/deploy-huggingface-space.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4

      - name: Validate Hugging Face configuration
        env:
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_SPACE_ID" || (echo "Missing repository variable HF_SPACE_ID" && exit 1)
          test -n "$HF_TOKEN" || (echo "Missing repository secret HF_TOKEN" && exit 1)

      - name: Build Space deployment bundle
        run: |
          mkdir -p hf-deploy/server hf-deploy/data
          cp hf-space/README.md hf-deploy/README.md
          cp hf-space/Dockerfile hf-deploy/Dockerfile
          cp package.json pnpm-lock.yaml hf-deploy/
          cp server/app.js server/index.js server/portfolio-chain.js hf-deploy/server/
          cp data/portfolio-context.json hf-deploy/data/

      - name: Push bundle to Hugging Face Space
        env:
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID}" hf-space-repo
          find hf-space-repo -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R hf-deploy/. hf-space-repo/
          cd hf-space-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Deploy portfolio assistant from GitHub"
          git push origin HEAD
